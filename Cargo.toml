[workspace]
resolver = "3"
members = [
  "crates/breadb-catalog",
  "crates/breadb-cli",
  "crates/breadb-core",
  "crates/breadb-exec",
  "crates/breadb-parser",
  "crates/breadb-planner",
  "crates/breadb-storage",
  "crates/breadb-txn",
  "crates/breadb-wal",
]
default-members = [
  "crates/breadb-catalog",
  "crates/breadb-cli",
  "crates/breadb-core",
  "crates/breadb-exec",
  "crates/breadb-parser",
  "crates/breadb-planner",
  "crates/breadb-storage",
  "crates/breadb-txn",
  "crates/breadb-wal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["jny0444"]
license = "MIT"
repository = "https://github.com/jny0444/breadb"

[workspace.dependencies]
breadb-catalog = { path = "crates/breadb-catalog" }
breadb-cli = { path = "crates/breadb-cli" }
breadb-core = { path = "crates/breadb-core" }
breadb-exec = { path = "crates/breadb-exec" }
breadb-parser = { path = "crates/breadb-parser" }
breadb-planner = { path = "crates/breadb-planner" }
breadb-storage = { path = "crates/breadb-storage" }
breadb-txn = { path = "crates/breadb-txn" }
breadb-wal = { path = "crates/breadb-wal" }
